---
- name: Provision the native owner identity as a private candidate Secret
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Apply the native owner identity and normalize the candidate bearer token without disclosure
      ansible.builtin.command:
        argv:
          - /opt/homebrew/bin/python3.14
          - "{{ playbook_dir }}/owner_secret.py"
          - --runtime-root
          - "{{ awp_runtime_root }}"
          - --stack-sha256
          - "{{ awp_stack_sha256 }}"
      register: secret_result
      changed_when: "'candidate_owner_secret=updated' in secret_result.stdout"

    - name: Publish a redacted Secret update result
      ansible.builtin.debug:
        var: secret_result.stdout
