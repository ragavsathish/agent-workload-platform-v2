apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: awp-v2
resources:
  - grain.yaml
  - app-plane.yaml
  - telemetry.yaml
  - grafana-network-policy.yaml
  - grafana-mcp.yaml
  - mlflow.yaml
  - node-metrics.yaml
  - storage-metrics.yaml
configMapGenerator:
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=dashboards/dashboards.yml
  - name: grafana-product-dashboards
    files:
      - pipecat-overview.json=dashboards/pipecat-overview.json
      - k3d-overview.json=dashboards/k3d-overview.json
      - storage-capacity.json=dashboards/storage-capacity.json
      - c4-heatmap.json=dashboards/c4-heatmap.json
  - name: storage-metrics-script
    files:
      - storage_exporter.py
