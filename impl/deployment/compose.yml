name: ${AWP_PUBLIC_PROJECT:?set AWP_PUBLIC_PROJECT}
services:
  gitea:
    profiles: [candidate-dependency]
    image: docker.gitea.com/gitea:28.1.0-rootless@sha256:b1a90409ae9afcd5a5725404c3639da7245248848b99e35332968891290b953e
    restart: unless-stopped
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /var/lib/gitea/data/gitea.db
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__HTTP_ADDR: 0.0.0.0
      GITEA__server__ROOT_URL: http://127.0.0.1:${AWP_GITEA_PORT:?set AWP_GITEA_PORT}/
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
    ports: ["127.0.0.1:${AWP_GITEA_PORT:?set AWP_GITEA_PORT}:3000"]
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
  tailscale:
    image: docker.io/tailscale/tailscale@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    hostname: ${AWP_PUBLIC_NODE:?set AWP_PUBLIC_NODE}
    restart: unless-stopped
    environment:
      TS_USERSPACE: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /tmp/tailscaled.sock
      TS_HOSTNAME: ${AWP_PUBLIC_NODE:?set AWP_PUBLIC_NODE}
      TS_ACCEPT_DNS: "false"
      TS_AUTH_ONCE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No host port: only Tailscale Serve can reach the proxy listener.
  traefik:
    image: traefik:3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    restart: unless-stopped
    depends_on: [tailscale, voice-edge]
    network_mode: service:tailscale
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/routes.yml:/etc/traefik/routes.yml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
  voice-edge:
    build:
      context: ../runtime/products/voice-agent
      dockerfile: apps/edge/Containerfile
    image: local/awp-v2-voice-edge:latest
    restart: unless-stopped
    depends_on: [tailscale]
    network_mode: service:tailscale
    env_file: ["${AWP_PUBLIC_EDGE_ENV:?set AWP_PUBLIC_EDGE_ENV}"]
    environment:
      INFERENCE_BROKER_BASE_URL: http://host.docker.internal:${AWP_BROKER_PORT:?set AWP_BROKER_PORT}/v1
      EDGE_ALLOW_LOCAL_INGRESS: "false"
      VOICE_LLM_BACKEND: pi
    command: ["-t", "webrtc", "--host", "127.0.0.1", "--port", "7860"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=256m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    volumes:
      - voice-diagnostics:/var/lib/voice-diagnostics
volumes:
  gitea-data:
  gitea-config:
  tailscale-state:
  voice-diagnostics:
