apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-mcp-scripts
  namespace: awp-v2
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu
    umask 077
    grafana_url="${GRAFANA_URL:?GRAFANA_URL is required}"
    token_file="${GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE:?GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE is required}"
    admin_password="$(cat /run/secrets/grafana-admin-password)"
    if [ -s "$token_file" ] && curl -fsS -H "Authorization: Bearer $(cat "$token_file")" "$grafana_url/api/user" >/dev/null; then exit 0; fi
    accounts="$(curl -fsS --user "admin:$admin_password" "$grafana_url/api/serviceaccounts/search?query=agent-workload-platform-mcp")"
    account_id="$(printf '%s' "$accounts" | sed -n 's/.*"id":\([0-9][0-9]*\).*"name":"agent-workload-platform-mcp".*/\1/p' | head -1)"
    if [ -z "$account_id" ]; then
      created="$(curl -fsS --user "admin:$admin_password" -H 'Content-Type: application/json' -d '{"name":"agent-workload-platform-mcp","role":"Viewer","isDisabled":false}' "$grafana_url/api/serviceaccounts")"
      account_id="$(printf '%s' "$created" | sed -n 's/.*"id":\([0-9][0-9]*\).*/\1/p')"
    fi
    case "$account_id" in ''|*[!0-9]*) echo "Grafana service-account bootstrap returned no numeric id" >&2; exit 1 ;; esac
    token_name="mcp-$(date +%s)"
    created_token="$(curl -fsS --user "admin:$admin_password" -H 'Content-Type: application/json' -d "{\"name\":\"$token_name\",\"secondsToLive\":0}" "$grafana_url/api/serviceaccounts/$account_id/tokens")"
    token="$(printf '%s' "$created_token" | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')"
    [ -n "$token" ] || { echo "Grafana returned no service-account token" >&2; exit 1; }
    temporary="$token_file.part"
    printf '%s\n' "$token" > "$temporary"
    chmod 0400 "$temporary"
    mv "$temporary" "$token_file"
  run.sh: |
    #!/bin/sh
    set -eu
    export MCP_GRAFANA_SERVER_TOKEN="$(cat /run/secrets/grafana-mcp-caller-token)"
    exec /app/mcp-grafana --transport streamable-http --address 0.0.0.0:8000 --allowed-hosts 127.0.0.1:8000,localhost:8000,grafana-mcp:8000 --healthz-address 0.0.0.0:8080 --metrics --metrics-address 0.0.0.0:9090 --enabled-tools search,datasource,prometheus,dashboard,navigation,tempo,user --disable-write --usage-stats disabled --slow-request-threshold 2s
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-mcp-token-data
  namespace: awp-v2
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: awp-v2
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana-mcp
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: awp-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-service-account
          image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            - name: GRAFANA_URL
              value: http://otel-lgtm.awp-v2.svc.cluster.local:3000
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
              value: /var/lib/grafana-mcp/service-account-token
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: admin-password
              mountPath: /run/secrets
              readOnly: true
            - name: token-data
              mountPath: /var/lib/grafana-mcp
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: grafana-mcp
          image: grafana/mcp-grafana:2.0.2@sha256:78d208116ec52b09b44f0eca66892073b39aefcb64483c54d43255c8eab7e97a
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/run.sh"]
          env:
            - name: GRAFANA_URL
              value: http://otel-lgtm.awp-v2.svc.cluster.local:3000
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
              value: /var/lib/grafana-mcp/service-account-token
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://otel-lgtm.awp-v2.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: MCP_GRAFANA_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-caller
                  key: token
          ports:
            - { name: mcp, containerPort: 8000 }
            - { name: health, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: token-data, mountPath: /var/lib/grafana-mcp, readOnly: true }
            - { name: caller-token, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: scripts
          configMap:
            name: grafana-mcp-scripts
            defaultMode: 0555
        - name: admin-password
          secret:
            secretName: grafana-admin
            items:
              - { key: password, path: grafana-admin-password }
        - name: caller-token
          secret:
            secretName: grafana-mcp-caller
            items:
              - { key: token, path: grafana-mcp-caller-token }
        - name: token-data
          persistentVolumeClaim:
            claimName: grafana-mcp-token-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
