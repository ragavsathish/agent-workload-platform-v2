---
- name: Verify redacted native owner and candidate token inputs without Secret mutation
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load native owner with pinned runtime semantics and check token normalization
      ansible.builtin.command:
        argv:
          - /opt/homebrew/bin/python3.14
          - "{{ playbook_dir }}/owner_secret.py"
          - --check
          - --runtime-root
          - "{{ awp_runtime_root }}"
          - --stack-sha256
          - "{{ awp_stack_sha256 }}"
      register: secret_input_result
      changed_when: false

    - name: Publish only redacted token input status
      ansible.builtin.debug:
        var: secret_input_result.stdout
