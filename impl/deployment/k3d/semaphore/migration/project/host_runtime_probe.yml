---
- name: Read-only v2 native host and k3d preflight
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Inspect only the approved service labels and local k3d readiness
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ playbook_dir }}/host_runtime_probe.py"
      register: host_runtime_result
      changed_when: false
      check_mode: false

    - name: Publish the allowlisted status summary
      ansible.builtin.debug:
        var: host_runtime_result.stdout
