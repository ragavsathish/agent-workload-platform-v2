apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-lgtm-ingress
  namespace: awp-v2
spec:
  podSelector:
    matchLabels:
      app: otel-lgtm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: voice-edge
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana-mcp
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 9090
