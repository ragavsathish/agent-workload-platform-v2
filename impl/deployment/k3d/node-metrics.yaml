apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-node-metrics
  namespace: awp-v2
data:
  fluent-bit.yaml: |
    service:
      flush: 1
      log_level: info
    pipeline:
      inputs:
        - name: node_exporter_metrics
          tag: k3d_node_metrics
          scrape_interval: 15
          path.procfs: /host/proc
          path.sysfs: /host/sys
          metrics: cpu,meminfo,loadavg,diskstats,netdev,stat,vmstat
      outputs:
        - name: prometheus_exporter
          match: k3d_node_metrics
          host: 0.0.0.0
          port: 2021
          add_label:
            - system k3d-node
            - layer node
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-lgtm-prometheus-scrape
  namespace: awp-v2
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_native_histograms: true
    otlp:
      keep_identifying_resource_attributes: true
      promote_resource_attributes:
        - service.instance.id
        - service.name
        - service.namespace
        - service.version
        - cloud.availability_zone
        - cloud.region
        - container.name
        - deployment.environment
        - deployment.environment.name
        - k8s.cluster.name
        - k8s.container.name
        - k8s.cronjob.name
        - k8s.daemonset.name
        - k8s.deployment.name
        - k8s.job.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.replicaset.name
        - k8s.statefulset.name
        - host.name
        - postgresql.database.name
        - postgresql.schema.name
        - postgresql.table.name
        - postgresql.index.name
        - database
        - kafka.cluster.alias
    storage:
      tsdb:
        out_of_order_time_window: 10m
    alerting:
      alertmanagers:
        - static_configs:
            - targets: []
    rule_files: []
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
            labels:
              app: prometheus
      - job_name: fluent-bit-k3d-node
        static_configs:
          - targets: ["fluent-bit-node-metrics.awp-v2.svc.cluster.local:2021"]
            labels:
              system: k3d-node
              layer: node
---
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit-node-metrics
  namespace: awp-v2
  labels:
    app.kubernetes.io/name: fluent-bit-node-metrics
    system: k3d-node
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluent-bit-node-metrics
  ports:
    - name: prometheus
      port: 2021
      targetPort: prometheus
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit-node-metrics
  namespace: awp-v2
  labels:
    app.kubernetes.io/name: fluent-bit-node-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit-node-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit-node-metrics
        system: k3d-node
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit@sha256:aff743e1a5e61d036d10a4472d67cdd7a6b408c92218eb86e3f301e2bac7817a
          imagePullPolicy: IfNotPresent
          args: ["--config=/fluent-bit/etc/fluent-bit.yaml"]
          ports:
            - name: prometheus
              containerPort: 2021
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.yaml
              subPath: fluent-bit.yaml
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: fluent-bit-node-metrics
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
