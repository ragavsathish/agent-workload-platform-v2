apiVersion: v1
kind: Service
metadata:
  name: voice-edge
  namespace: awp-v2
  labels:
    app.kubernetes.io/name: voice-edge
    app.kubernetes.io/part-of: agent-workload-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: voice-edge
  ports:
    - name: http
      port: 7860
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-edge
  namespace: awp-v2
  labels:
    app.kubernetes.io/name: voice-edge
    app.kubernetes.io/part-of: agent-workload-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voice-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voice-edge
        app.kubernetes.io/part-of: agent-workload-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: voice-edge
          image: awp-v2-voice-edge:slice47
          imagePullPolicy: Never
          command: ["/app/.venv/bin/python", "bot.py"]
          args: ["-t", "webrtc", "--host", "0.0.0.0", "--port", "7860"]
          ports:
            - name: http
              containerPort: 7860
          env:
            - name: INFERENCE_BROKER_BASE_URL
              value: http://host.docker.internal:9443/v1
            - name: INFERENCE_BROKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: broker-client
                  key: token
            - name: AGENT_GATEWAY_BASE_URL
              value: http://agent-gateway.awp-v2.svc.cluster.local:9444/v1
            - name: AGENT_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-access
                  key: token
            - name: GRAFANA_MCP_URL
              value: http://grafana-mcp:8000/mcp
            - name: GRAFANA_MCP_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-caller
                  key: token
            - name: PLAYWRIGHT_TRACE_VIEWER_INTERNAL_BASE_URL
              value: http://host.docker.internal:9450
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-lgtm.awp-v2.svc.cluster.local:4318
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: awp-v2-local
            - name: VOICE_DIAGNOSTIC_DIR
              value: /var/lib/voice-diagnostics
            - name: VOICE_DIAGNOSTIC_MAX_SESSIONS
              value: "5"
            - name: VOICE_DIAGNOSTIC_MAX_SECONDS
              value: "1800"
            - name: EDGE_ALLOW_LOCAL_INGRESS
              value: "false"
          envFrom:
            - secretRef:
                name: voice-edge-settings
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: diagnostics
              mountPath: /var/lib/voice-diagnostics
            - name: owner-sample
              mountPath: /run/secrets/voxlock-voice-sample
              subPath: voxlock-voice-sample
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/features
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/features
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.104.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -n "${TS_AUTHKEY:-}" ] || [ -f "${TS_STATE_DIR}/.enrolled" ]; then
                exec /usr/local/bin/containerboot
              fi
              echo "Tailscale enrollment pending; waiting for the local bootstrap helper"
              exec /bin/sleep infinity
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: voice-tailnet-auth
                  key: authkey
                  optional: true
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_HOSTNAME
              value: awp-v2-voice
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_SERVE_CONFIG
              value: /etc/tailscale/serve-config.json
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: tailscale-serve-config
              mountPath: /etc/tailscale
              readOnly: true
            - name: tailscale-tun
              mountPath: /dev/net/tun
          securityContext:
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: diagnostics
          emptyDir:
            sizeLimit: 128Mi
        - name: owner-sample
          secret:
            secretName: voxlock-owner-sample
            defaultMode: 0440
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: voice-tailnet-state
        - name: tailscale-serve-config
          configMap:
            name: voice-tailnet-serve
            items:
              - key: serve-config.json
                path: serve-config.json
        - name: tailscale-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
